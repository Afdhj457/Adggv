<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面访问器 · 跳转/下载/内套</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 1.2rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            font-weight: 300;
        }

        .input-group {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .url-input {
            flex: 1;
            min-width: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3rem;
            padding: 0.85rem 1.3rem;
            font-size: 1rem;
            color: #f1f5f9;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .url-input::placeholder {
            color: #64748b;
        }

        .url-input:focus {
            border-color: #38bdf8;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .button-row {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3rem;
            padding: 0.85rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 20px -8px #0ea5e9;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
            box-shadow: 0 12px 24px -8px #0ea5e9;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 20px -8px #10b981;
        }

        .btn-download:hover:not(:disabled) {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 12px 24px -8px #10b981;
        }

        .btn-embed {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 20px -8px #a855f7;
        }

        .btn-embed:hover:not(:disabled) {
            background: linear-gradient(135deg, #c084fc, #a855f7);
            box-shadow: 0 12px 24px -8px #a855f7;
        }

        .btn-icon {
            font-size: 1.05rem;
            line-height: 1;
        }

        .hint {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1rem;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            font-size: 0.82rem;
            line-height: 1.7;
            margin-top: 0.5rem;
        }

        .hint strong {
            color: #bae6fd;
            font-weight: 500;
        }

        .hint code {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.12rem 0.45rem;
            border-radius: 0.4rem;
            color: #7dd3fc;
            font-size: 0.78rem;
        }

        .hint .warn {
            color: #fbbf24;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            min-height: 1.2rem;
            padding-left: 1rem;
            margin-bottom: 0.4rem;
        }

        .status-msg {
            color: #34d399;
            font-size: 0.85rem;
            min-height: 1.2rem;
            padding-left: 1rem;
            margin-bottom: 0.4rem;
        }

        /* 内套 iframe 区域 */
        .embed-wrapper {
            display: none;
            margin-top: 1.2rem;
            border-radius: 1.2rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0b1220;
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.8);
        }

        .embed-wrapper.active {
            display: block;
        }

        .embed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .embed-url {
            flex: 1;
            color: #7dd3fc;
            font-size: 0.8rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: ui-monospace, monospace;
        }

        .embed-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .embed-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.6rem;
            padding: 0.3rem 0.7rem;
            font-size: 0.75rem;
            color: #cbd5e1;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .embed-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.4);
            color: #e0f2fe;
        }

        .embed-btn.close-embed:hover {
            background: rgba(248, 113, 113, 0.25);
            border-color: rgba(248, 113, 113, 0.4);
            color: #fecaca;
        }

        .embed-frame {
            width: 100%;
            height: 520px;
            border: none;
            display: block;
            background: white;
        }

        /* 内套加载提示 */
        .embed-loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(11, 18, 32, 0.95);
            color: #94a3b8;
            font-size: 0.9rem;
            gap: 0.6rem;
            z-index: 2;
        }

        .embed-frame-wrap {
            position: relative;
            min-height: 520px;
        }

        .embed-frame-wrap .embed-loading.hidden {
            display: none;
        }

        /* 最近记录 */
        .recent {
            margin-top: 1.2rem;
        }

        .recent-title {
            color: #64748b;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            padding-left: 0.3rem;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 180px;
            overflow-y: auto;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            padding: 0.55rem 0.9rem;
            color: #cbd5e1;
            font-size: 0.82rem;
            transition: all 0.15s ease;
            overflow: hidden;
        }

        .recent-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .recent-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .recent-url:hover {
            color: #e0f2fe;
        }

        .recent-actions {
            display: flex;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .mini-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.55rem;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s ease;
            color: #cbd5e1;
        }

        .mini-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.4);
            color: #e0f2fe;
        }

        .mini-btn.download-mini:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }

        .mini-btn.embed-mini:hover {
            background: rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.5);
            color: #e9d5ff;
        }

        /* 滚动条美化 */
        .recent-list::-webkit-scrollbar {
            width: 6px;
        }
        .recent-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .recent-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        .recent-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">🌐 页面访问器</div>
        <div class="subtitle">跳转 · 下载 · 内套访问</div>

        <div class="input-group">
            <input 
                type="text" 
                class="url-input" 
                id="urlInput" 
                placeholder="例如：example.com 或 https://..."
                autocomplete="off"
                autofocus
            >
        </div>

        <div class="button-row">
            <button class="btn btn-primary" id="goBtn">
                <span class="btn-icon">🚀</span> 访问
            </button>
            <button class="btn btn-download" id="downloadBtn">
                <span class="btn-icon">⬇️</span> 下载网页
            </button>
            <button class="btn btn-embed" id="embedBtn">
                <span class="btn-icon">🖼️</span> 内套访问
            </button>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="status-msg" id="statusMsg"></div>

        <!-- 内套 iframe 区域 -->
        <div class="embed-wrapper" id="embedWrapper">
            <div class="embed-header">
                <span class="embed-url" id="embedUrlLabel">about:blank</span>
                <div class="embed-actions">
                    <button class="embed-btn" id="embedReloadBtn" title="刷新">↻ 刷新</button>
                    <button class="embed-btn" id="embedOpenBtn" title="新标签页打开">↗ 新标签</button>
                    <button class="embed-btn close-embed" id="embedCloseBtn" title="关闭内套">✕ 关闭</button>
                </div>
            </div>
            <div class="embed-frame-wrap">
                <div class="embed-loading" id="embedLoading">
                    <span class="spinner"></span> 正在加载页面...
                </div>
                <iframe 
                    class="embed-frame" 
                    id="embedFrame" 
                    src="about:blank"
                    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"
                    referrerpolicy="no-referrer"
                ></iframe>
            </div>
        </div>

        <div class="hint">
            <strong>💡 使用提示</strong><br>
            · 可以只输入域名，如 <code>baidu.com</code>，会自动补全 <code>https://</code><br>
            · 按 <code>回车</code> 访问 · <code>Shift+回车</code> 下载 · <code>Ctrl+回车</code> 内套<br>
            · <span class="warn">⚠️ 内套访问限制：</span>许多网站（如 Google、百度、淘宝等）会通过 <code>X-Frame-Options</code> 或 <code>CSP</code> 禁止被嵌入，此时内套会显示空白或报错，请改用「访问」或「下载」<br>
            · <span class="warn">⚠️ 下载限制：</span>受浏览器同源策略影响，跨域网站可能下载失败，会自动降级为打开新标签页手动保存
        </div>

        <div class="recent" id="recentSection" style="display: none;">
            <div class="recent-title">最近访问</div>
            <div class="recent-list" id="recentList"></div>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'page_visitor_recent';
            const MAX_RECENT = 6;

            const urlInput = document.getElementById('urlInput');
            const goBtn = document.getElementById('goBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const embedBtn = document.getElementById('embedBtn');
            const errorMsg = document.getElementById('errorMsg');
            const statusMsg = document.getElementById('statusMsg');
            const recentSection = document.getElementById('recentSection');
            const recentList = document.getElementById('recentList');

            const embedWrapper = document.getElementById('embedWrapper');
            const embedFrame = document.getElementById('embedFrame');
            const embedLoading = document.getElementById('embedLoading');
            const embedUrlLabel = document.getElementById('embedUrlLabel');
            const embedReloadBtn = document.getElementById('embedReloadBtn');
            const embedOpenBtn = document.getElementById('embedOpenBtn');
            const embedCloseBtn = document.getElementById('embedCloseBtn');

            let isDownloading = false;
            let currentEmbedUrl = '';

            // ========== 历史记录 ==========
            function getRecentList() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (!data) return [];
                    const arr = JSON.parse(data);
                    return Array.isArray(arr) ? arr : [];
                } catch (e) {
                    return [];
                }
            }

            function saveRecent(url) {
                let list = getRecentList();
                list = list.filter(item => item !== url);
                list.unshift(url);
                if (list.length > MAX_RECENT) {
                    list = list.slice(0, MAX_RECENT);
                }
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                } catch (e) {
                    console.warn('保存历史失败:', e);
                }
                renderRecent();
            }

            function renderRecent() {
                const list = getRecentList();
                if (list.length === 0) {
                    recentSection.style.display = 'none';
                    return;
                }
                recentSection.style.display = 'block';
                recentList.innerHTML = '';
                list.forEach(url => {
                    const item = document.createElement('div');
                    item.className = 'recent-item';

                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'recent-url';
                    urlSpan.title = url;
                    urlSpan.textContent = url;
                    urlSpan.addEventListener('click', () => {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    });

                    const actions = document.createElement('div');
                    actions.className = 'recent-actions';

                    // 访问
                    const visitMini = document.createElement('div');
                    visitMini.className = 'mini-btn';
                    visitMini.title = '访问（新标签页）';
                    visitMini.textContent = '🚀';
                    visitMini.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(url, '_blank', 'noopener,noreferrer');
                    });

                    // 下载
                    const downloadMini = document.createElement('div');
                    downloadMini.className = 'mini-btn download-mini';
                    downloadMini.title = '下载网页';
                    downloadMini.textContent = '⬇️';
                    downloadMini.addEventListener('click', (e) => {
                        e.stopPropagation();
                        urlInput.value = url;
                        downloadPage(url);
                    });

                    // 内套
                    const embedMini = document.createElement('div');
                    embedMini.className = 'mini-btn embed-mini';
                    embedMini.title = '内套访问';
                    embedMini.textContent = '🖼️';
                    embedMini.addEventListener('click', (e) => {
                        e.stopPropagation();
                        urlInput.value = url;
                        embedPage(url);
                    });

                    actions.appendChild(visitMini);
                    actions.appendChild(downloadMini);
                    actions.appendChild(embedMini);

                    item.appendChild(urlSpan);
                    item.appendChild(actions);
                    recentList.appendChild(item);
                });
            }

            // ========== 工具函数 ==========
            function normalizeUrl(input) {
                let url = input.trim();
                if (!url) return null;
                if (/^https?:\/\//i.test(url)) return url;
                if (/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) return url;
                return 'https://' + url;
            }

            function validateUrl(url) {
                try {
                    const parsed = new URL(url);
                    if (parsed.protocol === 'http:' || parsed.protocol === 'https:' ||
                        parsed.protocol === 'file:' || parsed.protocol === 'data:') {
                        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                            const host = parsed.hostname;
                            const isLocalhost = host === 'localhost' || host === '127.0.0.1';
                            const isIp = /^\d+\.\d+\.\d+\.\d+$/.test(host);
                            const hasDot = host.includes('.');
                            if (!isLocalhost && !isIp && !hasDot) {
                                return { ok: false, msg: '⚠️ 网址格式似乎不正确，请检查' };
                            }
                        }
                    }
                    return { ok: true, url };
                } catch (e) {
                    return { ok: false, msg: '⚠️ 无效的网址，请检查后重试' };
                }
            }

            function getSafeFilename(url) {
                try {
                    const parsed = new URL(url);
                    let name = parsed.hostname + parsed.pathname;
                    name = name.replace(/\/$/, '');
                    name = name.replace(/[\\/:*?"<>|]/g, '_');
                    if (!name) name = 'webpage';
                    return name + '.html';
                } catch (e) {
                    return 'webpage.html';
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                statusMsg.textContent = '';
            }

            function clearMessages() {
                errorMsg.textContent = '';
                statusMsg.textContent = '';
            }

            // ========== 跳转 ==========
            function goToUrl() {
                const url = normalizeUrl(urlInput.value);
                clearMessages();

                if (!url) {
                    showError('⚠️ 请输入网址');
                    urlInput.focus();
                    return;
                }

                const validation = validateUrl(url);
                if (!validation.ok) {
                    showError(validation.msg);
                    return;
                }

                saveRecent(url);
                window.open(url, '_blank', 'noopener,noreferrer');
                urlInput.value = '';
                urlInput.focus();
            }

            // ========== 下载 ==========
            function setDownloading(state) {
                isDownloading = state;
                downloadBtn.disabled = state;
                goBtn.disabled = state;
                embedBtn.disabled = state;
            }

            async function tryFetchDownload(url) {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'omit'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const blob = await response.blob();
                const filename = getSafeFilename(url);
                triggerDownload(blob, filename);
                return true;
            }

            function tryDirectDownload(url) {
                return new Promise((resolve) => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = getSafeFilename(url);
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => resolve(true), 300);
                });
            }

            function fallbackOpenAndHint(url) {
                window.open(url, '_blank', 'noopener,noreferrer');
                statusMsg.innerHTML = '💡 已在新标签页打开，请按 <code>Ctrl+S</code> 保存网页';
            }

            function triggerDownload(blob, filename) {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            }

            async function downloadPage(targetUrl) {
                const raw = targetUrl || urlInput.value;
                const url = normalizeUrl(raw);
                clearMessages();

                if (!url) {
                    showError('⚠️ 请输入网址');
                    urlInput.focus();
                    return;
                }

                const validation = validateUrl(url);
                if (!validation.ok) {
                    showError(validation.msg);
                    return;
                }

                if (isDownloading) {
                    showError('⏳ 正在下载中，请稍候...');
                    return;
                }

                saveRecent(url);
                setDownloading(true);
                statusMsg.textContent = '⏳ 正在尝试下载网页...';

                try {
                    await tryFetchDownload(url);
                    statusMsg.textContent = '✅ 下载成功！';
                    urlInput.value = '';
                } catch (fetchError) {
                    console.warn('fetch 下载失败，尝试直接下载:', fetchError);
                    try {
                        await tryDirectDownload(url);
                        statusMsg.textContent = '✅ 已触发下载（若未开始请检查浏览器设置）';
                        urlInput.value = '';
                    } catch (directError) {
                        console.warn('直接下载也失败:', directError);
                        fallbackOpenAndHint(url);
                        urlInput.value = '';
                    }
                } finally {
                    setDownloading(false);
                    setTimeout(() => {
                        if (statusMsg.textContent.includes('下载成功') || statusMsg.textContent.includes('已触发')) {
                            statusMsg.textContent = '';
                        }
                    }, 4000);
                }
            }

            // ========== 内套访问 ==========
            function embedPage(targetUrl) {
                const raw = targetUrl || urlInput.value;
                const url = normalizeUrl(raw);
                clearMessages();

                if (!url) {
                    showError('⚠️ 请输入网址');
                    urlInput.focus();
                    return;
                }

                const validation = validateUrl(url);
                if (!validation.ok) {
                    showError(validation.msg);
                    return;
                }

                saveRecent(url);

                // 显示内套区域
                embedWrapper.classList.add('active');
                currentEmbedUrl = url;
                embedUrlLabel.textContent = url;
                embedUrlLabel.title = url;

                // 显示加载提示
                embedLoading.classList.remove('hidden');

                // 加载到 iframe
                embedFrame.src = url;

                // 滚动到内套区域
                setTimeout(() => {
                    embedWrapper.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);

                statusMsg.textContent = '🖼️ 已在内套中打开（若空白说明目标网站禁止嵌入）';
                setTimeout(() => {
                    if (statusMsg.textContent.includes('内套中打开')) {
                        statusMsg.textContent = '';
                    }
                }, 4000);

                urlInput.value = '';
            }

            // iframe 加载完成
            embedFrame.addEventListener('load', () => {
                // 隐藏加载提示
                embedLoading.classList.add('hidden');
            });

            // 关闭内套
            function closeEmbed() {
                embedWrapper.classList.remove('active');
                embedFrame.src = 'about:blank';
                currentEmbedUrl = '';
                embedUrlLabel.textContent = 'about:blank';
                embedLoading.classList.remove('hidden');
                clearMessages();
            }

            // 刷新内套
            function reloadEmbed() {
                if (currentEmbedUrl) {
                    embedLoading.classList.remove('hidden');
                    embedFrame.src = currentEmbedUrl;
                }
            }

            // 新标签页打开当前内套地址
            function openEmbedInNewTab() {
                if (currentEmbedUrl) {
                    window.open(currentEmbedUrl, '_blank', 'noopener,noreferrer');
                }
            }

            // ========== 事件绑定 ==========
            goBtn.addEventListener('click', goToUrl);

            downloadBtn.addEventListener('click', () => {
                downloadPage();
            });

            embedBtn.addEventListener('click', () => {
                embedPage();
            });

            embedCloseBtn.addEventListener('click', closeEmbed);
            embedReloadBtn.addEventListener('click', reloadEmbed);
            embedOpenBtn.addEventListener('click', openEmbedInNewTab);

            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isDownloading) return;
                    if (e.ctrlKey || e.metaKey) {
                        embedPage();
                    } else if (e.shiftKey) {
                        downloadPage();
                    } else {
                        goToUrl();
                    }
                }
            });

            urlInput.addEventListener('input', () => {
                clearMessages();
            });

            renderRecent();

            window.addEventListener('focus', () => {
                urlInput.focus();
            });
        })();
    </script>
</body>
</html>
