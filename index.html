<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面访问器 · 跳转 & 下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.08);
        }

        .title {
            font-size: 1.2rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 400;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .url-input {
            flex: 1;
            min-width: 200px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3rem;
            padding: 0.9rem 1.4rem;
            font-size: 1rem;
            color: #f1f5f9;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .url-input::placeholder {
            color: #64748b;
        }

        .url-input:focus {
            border-color: #38bdf8;
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .button-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 130px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 3rem;
            padding: 0.9rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: #f1f5f9;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.02);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 20px -8px #0ea5e9;
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #38bdf8, #60a5fa);
            box-shadow: 0 12px 24px -8px #0ea5e9;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 20px -8px #10b981;
        }

        .btn-download:hover:not(:disabled) {
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 12px 24px -8px #10b981;
        }

        .btn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        .hint {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1rem;
            padding: 1rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            font-size: 0.85rem;
            line-height: 1.7;
            margin-top: 0.5rem;
        }

        .hint strong {
            color: #bae6fd;
            font-weight: 500;
        }

        .hint code {
            background: rgba(0, 0, 0, 0.4);
            padding: 0.15rem 0.5rem;
            border-radius: 0.5rem;
            color: #7dd3fc;
            font-size: 0.8rem;
        }

        .hint .warn {
            color: #fbbf24;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            min-height: 1.2rem;
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .status-msg {
            color: #34d399;
            font-size: 0.85rem;
            min-height: 1.2rem;
            padding-left: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .recent {
            margin-top: 1.5rem;
        }

        .recent-title {
            color: #64748b;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            padding-left: 0.3rem;
        }

        .recent-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1rem;
            padding: 0.6rem 1rem;
            color: #cbd5e1;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            overflow: hidden;
        }

        .recent-item:hover {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .recent-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
        }

        .recent-url:hover {
            color: #e0f2fe;
        }

        .recent-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .mini-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 0.6rem;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s ease;
            color: #cbd5e1;
        }

        .mini-btn:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: rgba(56, 189, 248, 0.4);
            color: #e0f2fe;
        }

        .mini-btn.download-mini:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }

        /* 进度条 */
        .progress-bar {
            display: none;
            width: 100%;
            height: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            width: 0%;
            transition: width 0.2s ease;
            border-radius: 4px;
        }

        .progress-fill.indeterminate {
            width: 30%;
            animation: indeterminate 1.2s infinite ease-in-out;
        }

        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">🌐 页面访问器</div>
        <div class="subtitle">输入网址 · 跳转 或 下载网页</div>

        <div class="input-group">
            <input 
                type="text" 
                class="url-input" 
                id="urlInput" 
                placeholder="例如：example.com 或 https://..."
                autocomplete="off"
                autofocus
            >
        </div>

        <div class="button-row">
            <button class="btn btn-primary" id="goBtn">
                <span class="btn-icon">🚀</span> 访问
            </button>
            <button class="btn btn-download" id="downloadBtn">
                <span class="btn-icon">⬇️</span> 下载网页
            </button>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="status-msg" id="statusMsg"></div>

        <div class="hint">
            <strong>💡 使用提示</strong><br>
            · 可以只输入域名，如 <code>baidu.com</code>，会自动补全 <code>https://</code><br>
            · 按 <code>回车键</code> 快速访问<br>
            · <span class="warn">⚠️ 下载功能</span>受浏览器同源策略限制，仅能下载允许跨域访问的网页<br>
            · 若下载失败，会自动尝试在新标签页打开该网页供你手动保存（Ctrl+S）
        </div>

        <div class="recent" id="recentSection" style="display: none;">
            <div class="recent-title">最近访问</div>
            <div class="recent-list" id="recentList"></div>
        </div>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'page_visitor_recent';
            const MAX_RECENT = 6;

            const urlInput = document.getElementById('urlInput');
            const goBtn = document.getElementById('goBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const errorMsg = document.getElementById('errorMsg');
            const statusMsg = document.getElementById('statusMsg');
            const recentSection = document.getElementById('recentSection');
            const recentList = document.getElementById('recentList');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            let isDownloading = false;

            // ========== 历史记录 ==========
            function getRecentList() {
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (!data) return [];
                    const arr = JSON.parse(data);
                    return Array.isArray(arr) ? arr : [];
                } catch (e) {
                    return [];
                }
            }

            function saveRecent(url) {
                let list = getRecentList();
                list = list.filter(item => item !== url);
                list.unshift(url);
                if (list.length > MAX_RECENT) {
                    list = list.slice(0, MAX_RECENT);
                }
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
                } catch (e) {
                    console.warn('保存历史失败:', e);
                }
                renderRecent();
            }

            function renderRecent() {
                const list = getRecentList();
                if (list.length === 0) {
                    recentSection.style.display = 'none';
                    return;
                }
                recentSection.style.display = 'block';
                recentList.innerHTML = '';
                list.forEach(url => {
                    const item = document.createElement('div');
                    item.className = 'recent-item';

                    const urlSpan = document.createElement('span');
                    urlSpan.className = 'recent-url';
                    urlSpan.title = url;
                    urlSpan.textContent = url;
                    urlSpan.addEventListener('click', () => {
                        window.open(url, '_blank', 'noopener,noreferrer');
                    });

                    const actions = document.createElement('div');
                    actions.className = 'recent-actions';

                    // 访问按钮
                    const visitMini = document.createElement('div');
                    visitMini.className = 'mini-btn';
                    visitMini.title = '访问';
                    visitMini.textContent = '🚀';
                    visitMini.addEventListener('click', (e) => {
                        e.stopPropagation();
                        window.open(url, '_blank', 'noopener,noreferrer');
                    });

                    // 下载按钮
                    const downloadMini = document.createElement('div');
                    downloadMini.className = 'mini-btn download-mini';
                    downloadMini.title = '下载网页';
                    downloadMini.textContent = '⬇️';
                    downloadMini.addEventListener('click', (e) => {
                        e.stopPropagation();
                        urlInput.value = url;
                        downloadPage(url);
                    });

                    actions.appendChild(visitMini);
                    actions.appendChild(downloadMini);

                    item.appendChild(urlSpan);
                    item.appendChild(actions);
                    recentList.appendChild(item);
                });
            }

            // ========== 工具函数 ==========
            function normalizeUrl(input) {
                let url = input.trim();
                if (!url) return null;
                if (/^https?:\/\//i.test(url)) return url;
                if (/^[a-z][a-z0-9+.-]*:\/\//i.test(url)) return url;
                return 'https://' + url;
            }

            function validateUrl(url) {
                try {
                    const parsed = new URL(url);
                    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                        const host = parsed.hostname;
                        const isLocalhost = host === 'localhost' || host === '127.0.0.1';
                        const isIp = /^\d+\.\d+\.\d+\.\d+$/.test(host);
                        const hasDot = host.includes('.');
                        if (!isLocalhost && !isIp && !hasDot) {
                            return { ok: false, msg: '⚠️ 网址格式似乎不正确，请检查' };
                        }
                    }
                    return { ok: true, url };
                } catch (e) {
                    return { ok: false, msg: '⚠️ 无效的网址，请检查后重试' };
                }
            }

            function getSafeFilename(url) {
                try {
                    const parsed = new URL(url);
                    let name = parsed.hostname + parsed.pathname;
                    // 移除末尾斜杠
                    name = name.replace(/\/$/, '');
                    // 替换非法字符
                    name = name.replace(/[\\/:*?"<>|]/g, '_');
                    if (!name) name = 'webpage';
                    return name + '.html';
                } catch (e) {
                    return 'webpage.html';
                }
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                statusMsg.textContent = '';
            }

            function clearMessages() {
                errorMsg.textContent = '';
                statusMsg.textContent = '';
            }

            // ========== 跳转功能 ==========
            function goToUrl() {
                const url = normalizeUrl(urlInput.value);
                clearMessages();

                if (!url) {
                    showError('⚠️ 请输入网址');
                    urlInput.focus();
                    return;
                }

                const validation = validateUrl(url);
                if (!validation.ok) {
                    showError(validation.msg);
                    return;
                }

                saveRecent(url);
                window.open(url, '_blank', 'noopener,noreferrer');
                urlInput.value = '';
                urlInput.focus();
            }

            // ========== 下载功能 ==========
            function setDownloading(state) {
                isDownloading = state;
                downloadBtn.disabled = state;
                goBtn.disabled = state;
                if (state) {
                    progressBar.classList.add('active');
                    progressFill.classList.add('indeterminate');
                } else {
                    progressBar.classList.remove('active');
                    progressFill.classList.remove('indeterminate');
                    progressFill.style.width = '0%';
                }
            }

            // 方案A: 使用 fetch + blob 下载（支持跨域时会成功）
            async function tryFetchDownload(url) {
                const response = await fetch(url, {
                    method: 'GET',
                    mode: 'cors',
                    credentials: 'omit'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const blob = await response.blob();
                // 确保是 HTML 或文本类型
                const contentType = response.headers.get('content-type') || '';
                if (!contentType.includes('text/html') && !contentType.includes('text/plain') && !contentType.includes('application/xhtml')) {
                    // 不是网页类型也允许下载，但提示一下
                    console.warn('Content-Type 不是 HTML:', contentType);
                }

                const filename = getSafeFilename(url);
                triggerDownload(blob, filename);
                return true;
            }

            // 方案B: 使用 a 标签直接下载（适用于同源或服务器设置了 Content-Disposition）
            function tryDirectDownload(url) {
                return new Promise((resolve) => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = getSafeFilename(url);
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    // 无法准确判断是否成功，给个短暂延迟后认为成功
                    setTimeout(() => resolve(true), 300);
                });
            }

            // 方案C: 兜底 —— 在新标签页打开并提示用户 Ctrl+S
            function fallbackOpenAndHint(url) {
                window.open(url, '_blank', 'noopener,noreferrer');
                statusMsg.innerHTML = '💡 已在新标签页打开，请按 <code>Ctrl+S</code> (Mac: <code>⌘+S</code>) 保存网页';
            }

            function triggerDownload(blob, filename) {
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                // 延迟释放
                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            }

            async function downloadPage(targetUrl) {
                const raw = targetUrl || urlInput.value;
                const url = normalizeUrl(raw);
                clearMessages();

                if (!url) {
                    showError('⚠️ 请输入网址');
                    urlInput.focus();
                    return;
                }

                const validation = validateUrl(url);
                if (!validation.ok) {
                    showError(validation.msg);
                    return;
                }

                if (isDownloading) {
                    showError('⏳ 正在下载中，请稍候...');
                    return;
                }

                // 记录历史
                saveRecent(url);

                setDownloading(true);
                statusMsg.textContent = '⏳ 正在尝试下载网页...';

                // 尝试 fetch 下载
                try {
                    await tryFetchDownload(url);
                    statusMsg.textContent = '✅ 下载成功！';
                    urlInput.value = '';
                } catch (fetchError) {
                    console.warn('fetch 下载失败，尝试直接下载:', fetchError);

                    // 尝试直接 a 标签下载（同源或服务器支持时有效）
                    try {
                        await tryDirectDownload(url);
                        statusMsg.textContent = '✅ 已触发下载（若未开始请检查浏览器设置）';
                        urlInput.value = '';
                    } catch (directError) {
                        console.warn('直接下载也失败:', directError);
                        // 兜底方案
                        fallbackOpenAndHint(url);
                        urlInput.value = '';
                    }
                } finally {
                    setDownloading(false);
                    // 清理消息
                    setTimeout(() => {
                        if (statusMsg.textContent.includes('下载成功') || statusMsg.textContent.includes('已触发')) {
                            statusMsg.textContent = '';
                        }
                    }, 4000);
                }
            }

            // ========== 事件绑定 ==========
            goBtn.addEventListener('click', goToUrl);

            downloadBtn.addEventListener('click', () => {
                downloadPage();
            });

            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isDownloading) return;
                    // 默认回车是访问，按住 Shift + 回车 是下载
                    if (e.shiftKey) {
                        downloadPage();
                    } else {
                        goToUrl();
                    }
                }
            });

            urlInput.addEventListener('input', () => {
                clearMessages();
            });

            // 初始化
            renderRecent();

            window.addEventListener('focus', () => {
                urlInput.focus();
            });
        })();
    </script>
</body>
</html>
